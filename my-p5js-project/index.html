<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <link rel="icon" type="image/jpg" href="/color2-removebg-preview.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.2/lib/p5.min.js"></script>

</head>
<body>
    <label for="borderWidth" id="borderWidthLabel">Size (1-100)</label>
    <input id="borderWidth" type="number" min="0" max="100" step="5" value="10">
    <label for="saveName" id="saveNameLabel">Name Drawing</label>
    <input type="text" id="saveName" placeholder="untitled.png" value="untitled.png">
    <button id="canvasSave">Save Canvas</button>
    <button id="undoBtn" onclick="undoToPreviousState()"><img src="undo.png"></button>
    <button id="eraserToggle">Eraser</button>
    <button id="clearStorage">Clear Storage</button>
    <!-- if reading: this button just clears the local storage for saved on reload but you are free to combine it with clearing the entire canvas and the storage saved -->
    <script src="sketch.js"></script>
    <script src="undo.js"></script>
    <script src="eraser.js"></script>
</body>
</html>
