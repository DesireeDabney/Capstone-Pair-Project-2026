<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-p5js-project</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.2/lib/p5.min.js"></script>

</head>
<body>
    <label for="borderWidth" id="borderWidthLabel">Brush Size (1-100)</label>
    <input id="borderWidth" type="number" min="0" max="100" step="5" value="10">
    <label for="saveName" id="saveNameLabel">Name Drawing</label>
    <input type="text" id="saveName" placeholder="untitled.png" value="untitled.png">
    <button id="canvasSave">Save Canvas</button>
    <button style="top: 210px; left:80px; position: absolute;" onclick="undoToPreviousState()"><img src="undo.png" style="width: 40px; height: 40px;"></button>
    <script src="sketch.js"></script>
    <script src="undo.js"></script>
</body>
</html>
